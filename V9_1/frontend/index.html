<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Control Center</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; }
        .btn-primary { background: linear-gradient(to right, #3b82f6, #2563eb); color: white; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500; transition: all 0.2s; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-danger { background: linear-gradient(to right, #ef4444, #dc2626); color: white; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500; transition: all 0.2s; }
        .btn-danger:hover { opacity: 0.9; transform: translateY(-1px); }
        
        /* Modal Animation */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-backdrop { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DashboardWidget = ({ title, value, color }) => (
            <div className="glass-panel p-6 flex flex-col justify-center">
                <p className="text-slate-400 text-sm font-medium uppercase tracking-wider">{title}</p>
                <h3 className={`text-3xl font-bold mt-2 ${color}`}>{value}</h3>
            </div>
        );

        const App = () => {
            const [accounts, setAccounts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showLiveModal, setShowLiveModal] = useState(null);
            const [phrase, setPhrase] = useState("");

            const fetchAccounts = async () => {
                try {
                    const res = await fetch("/api/accounts");
                    const data = await res.json();
                    setAccounts(data);
                } catch (e) {
                    console.error("Failed to fetch accounts", e);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchAccounts();
            }, []);

            const enableLive = async (accountId) => {
                try {
                    const res = await fetch(`/api/accounts/${accountId}/enable_live`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ phrase })
                    });
                    const result = await res.json();
                    if (res.ok) {
                        alert(result.message);
                        setShowLiveModal(null);
                        setPhrase("");
                        fetchAccounts();
                    } else {
                        alert(result.detail || "Verification failed");
                    }
                } catch (e) {
                    alert("Network error");
                }
            };

            const totalAccs = accounts.length;
            const liveAccs = accounts.filter(a => a.account_type === 'live').length;
            const demoAccs = accounts.filter(a => a.account_type === 'demo').length;

            return (
                <div className="min-h-screen p-8">
                    <header className="mb-8 flex justify-between items-center">
                        <div>
                            <h1 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                                Institutional Control Center
                            </h1>
                            <p className="text-slate-400 mt-1">Manage broker fleet & execution limits</p>
                        </div>
                    </header>

                    {/* Widgets */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <DashboardWidget title="Total Accounts" value={totalAccs} color="text-white" />
                        <DashboardWidget title="Live Execution" value={liveAccs} color="text-emerald-400" />
                        <DashboardWidget title="Demo / Paper" value={demoAccs} color="text-blue-400" />
                        <DashboardWidget title="System Status" value="ONLINE" color="text-emerald-500" />
                    </div>

                    {/* Accounts Table */}
                    <div className="glass-panel overflow-hidden">
                        <div className="px-6 py-4 border-b border-slate-700 flex justify-between items-center">
                            <h2 className="text-xl font-semibold">Account Registry</h2>
                            <button className="btn-primary text-sm">+ New Account</button>
                        </div>
                        <div className="p-0 overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-800/50 text-slate-300 text-sm">
                                        <th className="p-4 font-medium">ID</th>
                                        <th className="p-4 font-medium">Broker</th>
                                        <th className="p-4 font-medium">Type</th>
                                        <th className="p-4 font-medium">Risk Limit</th>
                                        <th className="p-4 font-medium text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {loading ? (
                                        <tr><td colSpan="5" className="p-4 text-center text-slate-400">Loading registry...</td></tr>
                                    ) : accounts.length === 0 ? (
                                        <tr><td colSpan="5" className="p-4 text-center text-slate-400">No accounts configured.</td></tr>
                                    ) : accounts.map(acc => (
                                        <tr key={acc.id} className="border-b border-slate-800 hover:bg-slate-800/30 transition-colors">
                                            <td className="p-4 font-medium">{acc.id}</td>
                                            <td className="p-4 text-slate-300">{acc.broker}</td>
                                            <td className="p-4">
                                                {acc.account_type === 'live' ? 
                                                    <span className="px-2 py-1 bg-emerald-500/20 text-emerald-400 rounded text-xs font-semibold uppercase tracking-wider">LIVE</span> : 
                                                    <span className="px-2 py-1 bg-blue-500/20 text-blue-400 rounded text-xs font-semibold uppercase tracking-wider">DEMO</span>
                                                }
                                            </td>
                                            <td className="p-4 text-slate-300 text-sm">
                                                Max DD: {acc.risk_profile.max_drawdown_pct}% <br/>
                                                Daily: {acc.risk_profile.max_daily_loss_pct}%
                                            </td>
                                            <td className="p-4 text-right">
                                                {acc.account_type !== 'live' && (
                                                    <button onClick={() => setShowLiveModal(acc.id)} className="btn-danger text-sm mr-2">
                                                        Enable Live
                                                    </button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Modal */}
                    {showLiveModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop bg-black/60 backdrop-blur-sm">
                            <div className="glass-panel w-full max-w-md p-8 relative shadow-2xl border border-red-500/30">
                                <h2 className="text-2xl font-bold text-red-400 mb-2">⚠ Enable Live Execution</h2>
                                <p className="text-slate-300 mb-6 text-sm">
                                    You are about to authorize live capital risk for account <span className="text-white font-mono">{showLiveModal}</span>.
                                    Type <span className="font-mono bg-slate-800 px-1 rounded text-red-400 font-bold">ENABLE LIVE</span> to confirm.
                                </p>
                                <input 
                                    type="text" 
                                    className="w-full bg-slate-900 border border-slate-700 rounded-md p-3 text-white focus:outline-none focus:border-red-500 mb-6"
                                    placeholder="ENABLE LIVE"
                                    value={phrase}
                                    onChange={(e) => setPhrase(e.target.value)}
                                />
                                <div className="flex justify-end gap-3">
                                    <button 
                                        className="px-4 py-2 rounded text-slate-300 hover:text-white transition"
                                        onClick={() => { setShowLiveModal(null); setPhrase(""); }}
                                    >Cancel</button>
                                    <button 
                                        className="btn-danger"
                                        onClick={() => enableLive(showLiveModal)}
                                        disabled={phrase !== "ENABLE LIVE"}
                                    >Confirm Risk</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
