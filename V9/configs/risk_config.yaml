risk_engine:
  enabled: true
  sizing_mode: risk_based
  risk_per_trade_pct: 0.15
  max_basket_risk_pct: 0.75
  max_total_open_risk_pct: 1.5
  max_daily_loss_pct: 2.0
  hard_drawdown_stop_pct: 8.0
  max_open_positions_total: 10
  max_open_positions_per_symbol: 2
  max_pending_orders_per_symbol: 3
  max_same_direction_assets: 3
  cooldown_after_sl_minutes: 60
  block_new_trades_after_daily_loss: true
  block_dca_after_regime_flip: true
  block_trade_if_spread_high: true
  block_trade_if_news_high_impact: true

position_sizing:
  disable_fixed_lot_multi_asset: true
  default_risk_pct: 0.15
  max_lot:
    XAUUSDm: 0.05
    BTCUSDm: 0.05
    US30m: 0.03
    USTECm: 0.05
    US500m: 0.05
    EURUSDm: 0.05
    GBPUSDm: 0.05
    USDJPYm: 0.05
    USDCHFm: 0.05
    USDCADm: 0.05
    AUDUSDm: 0.05
    NZDUSDm: 0.05

correlation_guard:
  enabled: true
  max_same_direction_risk_assets: 2
  risk_assets:
    - XAUUSDm
    - BTCUSDm
    - US30m
    - USTECm
    - US500m
  usd_pairs:
    - EURUSDm
    - GBPUSDm
    - AUDUSDm
    - NZDUSDm
    - USDJPYm
    - USDCHFm
    - USDCADm
